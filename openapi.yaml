openapi: 3.1.0
info:
  title: SB Ecom API
  description: |
    REST API for the e-commerce backend (categories, products, carts, addresses, orders, Stripe payments, seller and admin management, analytics).

    **Authentication:** the JWT is stored in the `springBootEcom` cookie, not in an `Authorization` header. Call `POST /api/auth/signin` first; the browser keeps the cookie and Swagger UI then sends it with every "Try it out" request.

    **Access by path prefix:** `/api/auth/**` and `/api/public/**` need no cookie; `/api/seller/**` requires the `ROLE_SELLER` or `ROLE_ADMIN` role; `/api/admin/**` requires `ROLE_ADMIN`; every other endpoint just needs a signed-in user. A missing or expired cookie gives `401`; a signed-in user without the required role gives `403`.
  version: v1
servers:
- url: http://Ecom-app-env-1.eba-2vtjbpuc.eu-north-1.elasticbeanstalk.com
  description: AWS Elastic Beanstalk (HTTP only)
security:
- cookieAuth: []
tags:
- name: Addresses
  description: Shipping addresses
- name: Cart
  description: Shopping cart of the signed-in user
- name: Authentication
  description: Sign in, sign up, sign out, and current-user info
- name: Orders
  description: Checkout, Stripe payment, and order management for admins and sellers
- name: Categories
  description: Product category management
- name: Analytics
  description: Aggregate store statistics
- name: Products
  description: Product catalogue, search, and image upload
paths:
  /api/public/categories/{categoryId}:
    put:
      tags:
      - Categories
      summary: Update a category
      operationId: updateCategory
      parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CategoryDTO'
  /api/products/{productId}/image:
    put:
      tags:
      - Products
      summary: Upload a product image
      description: Multipart upload; the file goes in the `image` part.
      operationId: updateProductImage
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
              required:
              - image
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductDTO'
  /api/cart/products/{productId}/quantity/{operation}:
    put:
      tags:
      - Cart
      summary: Change a cart item's quantity
      description: '`operation` = `delete` decreases the quantity by 1; any other value increases it by
        1.'
      operationId: updateCartProduct
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: operation
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CartDTO'
  /api/admin/products/{productId}:
    put:
      tags:
      - Products
      summary: Update a product
      operationId: updateProduct
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductDTO'
    delete:
      tags:
      - Products
      summary: Delete a product
      operationId: deleteProduct
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductDTO'
  /api/address/{id}:
    get:
      tags:
      - Addresses
      summary: Get an address by id
      operationId: getAddressById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AddressDTO'
    put:
      tags:
      - Addresses
      summary: Update an address
      operationId: updateAddress
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AddressDTO'
    delete:
      tags:
      - Addresses
      summary: Delete an address
      operationId: deleteAddress
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /api/public/categories:
    get:
      tags:
      - Categories
      summary: List categories
      description: Paginated and sortable list of all categories.
      operationId: getAllCategories
      parameters:
      - name: pageNumber
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: sortBy
        in: query
        required: false
        schema:
          type: string
          default: categoryId
      - name: sortOrder
        in: query
        required: false
        schema:
          type: string
          default: asc
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CategoryResponse'
    post:
      tags:
      - Categories
      summary: Create a category
      operationId: createCategory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryDTO'
        required: true
      responses:
        '201':
          description: Category created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CategoryDTO'
  /api/order/users/payments/{paymentMethod}:
    post:
      tags:
      - Orders
      summary: Place an order from the signed-in user's cart
      description: '`paymentMethod` is the path segment; payment-gateway details go in the request body.'
      operationId: orderProducts
      parameters:
      - name: paymentMethod
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequestDTO'
        required: true
      responses:
        '201':
          description: Order placed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderDTO'
  /api/carts/products/{productId}/quantity/{quantity}:
    post:
      tags:
      - Cart
      summary: Add a product to the cart
      operationId: addProductToCart
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: quantity
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '201':
          description: Product added
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CartDTO'
  /api/auth/signup:
    post:
      tags:
      - Authentication
      summary: Sign up
      description: Registers a new user. `roles` accepts `admin` and `seller`; anything else (or omitted)
        results in the plain user role.
      operationId: registerUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
        required: true
      responses:
        '200':
          description: User registered
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Validation error, or username/email already taken
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MessageResponse'
      security: []
  /api/auth/signout:
    post:
      tags:
      - Authentication
      summary: Sign out
      description: Clears the JWT cookie.
      operationId: signoutUser
      responses:
        '200':
          description: Signed out
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MessageResponse'
      security: []
  /api/auth/signin:
    post:
      tags:
      - Authentication
      summary: Sign in
      description: Validates the credentials and returns the user info. The JWT is set in the response
        cookie, which is then used to authenticate all other endpoints.
      operationId: authenticateUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInfoRequest'
        required: true
      responses:
        '200':
          description: Signed in; JWT cookie set
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        '404':
          description: Bad credentials
      security: []
  /api/admin/categories/{categoryId}/product:
    post:
      tags:
      - Products
      summary: Add a product to a category
      operationId: addProduct
      parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDTO'
        required: true
      responses:
        '201':
          description: Product created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductDTO'
  /api/addresses:
    get:
      tags:
      - Addresses
      summary: List all addresses
      operationId: getAddress
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressDTO'
    post:
      tags:
      - Addresses
      summary: Create an address for the signed-in user
      operationId: createAddress
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressDTO'
        required: true
      responses:
        '201':
          description: Address created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AddressDTO'
  /api/users/addresses:
    get:
      tags:
      - Addresses
      summary: List the signed-in user's addresses
      operationId: getAddressByUser
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressDTO'
  /api/public/products:
    get:
      tags:
      - Products
      summary: List products
      description: Paginated and sortable list of all products.
      operationId: getAllProducts
      parameters:
      - name: pageNumber
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: sortBy
        in: query
        required: false
        schema:
          type: string
          default: productId
      - name: sortOrder
        in: query
        required: false
        schema:
          type: string
          default: asc
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductResponse'
  /api/public/products/keyword/{keyword}:
    get:
      tags:
      - Products
      summary: Search products by keyword
      operationId: getProductsByKeyword
      parameters:
      - name: keyword
        in: path
        required: true
        schema:
          type: string
      - name: pageNumber
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: sortBy
        in: query
        required: false
        schema:
          type: string
          default: productId
      - name: sortOrder
        in: query
        required: false
        schema:
          type: string
          default: asc
      responses:
        '302':
          description: Matching products (the API replies 302 Found rather than 200)
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductResponse'
  /api/public/categories/{categoryId}/products:
    get:
      tags:
      - Products
      summary: List products in a category
      operationId: getProductsByCategory
      parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: pageNumber
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: sortBy
        in: query
        required: false
        schema:
          type: string
          default: productId
      - name: sortOrder
        in: query
        required: false
        schema:
          type: string
          default: asc
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductResponse'
  /api/carts:
    get:
      tags:
      - Cart
      summary: List all carts
      operationId: getcarts
      responses:
        '302':
          description: All carts (the API replies 302 Found rather than 200)
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CartDTO'
  /api/carts/users/cart:
    get:
      tags:
      - Cart
      summary: Get the signed-in user's cart
      operationId: getCartById
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CartDTO'
  /api/auth/username:
    get:
      tags:
      - Authentication
      summary: Get current username
      description: Returns the signed-in username, or `NULL` when not signed in.
      operationId: currentUsername
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /api/auth/user:
    get:
      tags:
      - Authentication
      summary: Get current user details
      operationId: getUserDetails
      responses:
        '200':
          description: Current user
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        '401':
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/admin/app/analytics:
    get:
      tags:
      - Analytics
      summary: Get product count, total orders, and total revenue
      operationId: getAnalytics
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AnalyticsResponse'
  /api/carts/{cartId}/product/{productId}:
    delete:
      tags:
      - Cart
      summary: Remove a product from a cart
      operationId: deleteProductFromCart
      parameters:
      - name: cartId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: productId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /api/admin/categories/{categoryId}:
    delete:
      tags:
      - Categories
      summary: Delete a category
      operationId: deleteCategory
      parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CategoryDTO'
  /api/auth/sellers:
    get:
      tags:
      - Authentication
      summary: List sellers
      description: Returns a page of users with the seller role, newest first. The page size is fixed at 10.
      operationId: getSellers
      parameters:
      - name: pageNumber
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserResponse'
  /api/seller/products:
    get:
      tags:
      - Products
      summary: List the signed-in seller's products
      description: |
        Requires `ROLE_SELLER` or `ROLE_ADMIN`. Only products whose seller is the signed-in user are returned,
        so products created before sellers were tracked (no seller set) never appear here.

        When the seller has no products the API replies `400` with the message `No Product created`
        instead of an empty page.
      operationId: getAllProductsForSeller
      parameters:
      - name: pageNumber
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: sortBy
        in: query
        required: false
        schema:
          type: string
          default: productId
      - name: sortOrder
        in: query
        required: false
        schema:
          type: string
          default: asc
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: The seller has no products (`No Product created`)
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/APIResponse'
  /api/seller/categories/{categoryId}/product:
    post:
      tags:
      - Products
      summary: Add a product to a category as a seller
      description: Requires `ROLE_SELLER` or `ROLE_ADMIN`. The signed-in user is recorded as the product's seller.
      operationId: addProductSeller
      parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDTO'
        required: true
      responses:
        '201':
          description: Product created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductDTO'
  /api/cart/create:
    post:
      tags:
      - Cart
      summary: Replace the signed-in user's cart with the given items
      description: Creates the cart if the user has none; otherwise every existing item is removed first.
        Returns a plain-text status message.
      operationId: createOrUpdateCart
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CartItemDTO'
        required: true
      responses:
        '201':
          description: Cart created or updated
          content:
            '*/*':
              schema:
                type: string
        '404':
          description: A product in the request does not exist
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/APIResponse'
  /api/admin/orders:
    get:
      tags:
      - Orders
      summary: List all orders
      description: Requires `ROLE_ADMIN`.
      operationId: getAllOrders
      parameters:
      - name: pageNumber
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: sortBy
        in: query
        required: false
        schema:
          type: string
          default: totalAmount
      - name: sortOrder
        in: query
        required: false
        schema:
          type: string
          default: asc
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderResponse'
  /api/seller/orders:
    get:
      tags:
      - Orders
      summary: List orders containing the signed-in seller's products
      description: Requires `ROLE_SELLER` or `ROLE_ADMIN`. Only orders with at least one item whose product
        belongs to the signed-in user are returned, and paging and totals count only those orders.
      operationId: getAllSellerOrders
      parameters:
      - name: pageNumber
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: sortBy
        in: query
        required: false
        schema:
          type: string
          default: totalAmount
      - name: sortOrder
        in: query
        required: false
        schema:
          type: string
          default: asc
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderResponse'
  /api/admin/orders/{orderId}/status:
    put:
      tags:
      - Orders
      summary: Update an order's status
      description: Requires `ROLE_ADMIN`. The status is stored as the given free-form string.
      operationId: updateOrderStatus
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdateDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderDTO'
        '404':
          description: Order not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/APIResponse'
  /api/seller/orders/{orderId}/status:
    put:
      tags:
      - Orders
      summary: Update an order's status as a seller
      description: Requires `ROLE_SELLER` or `ROLE_ADMIN`. The status is stored as the given free-form string.
      operationId: updateOrderStatusSeller
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdateDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderDTO'
        '404':
          description: Order not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/APIResponse'
  /api/order/stripe-client-secret:
    post:
      tags:
      - Orders
      summary: Create a Stripe PaymentIntent and return its client secret
      description: |
        Creates (or reuses, matched by email) a Stripe customer and a PaymentIntent. The `email` in the body is
        ignored; the signed-in user's email is used. `amount` is in the currency's smallest unit (for example
        cents). Needs the `STRIPE_SECRET_KEY` environment variable on the server.

        The response body is the plain-text client secret, which the frontend passes to Stripe.js.
      operationId: createStripeClientSecret
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StripePaymentDTO'
        required: true
      responses:
        '201':
          description: PaymentIntent created; body is its client secret
          content:
            '*/*':
              schema:
                type: string
components:
  schemas:
    CategoryDTO:
      type: object
      properties:
        categoryId:
          type: integer
          format: int64
        categoryName:
          type: string
    ProductDTO:
      type: object
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        description:
          type: string
        image:
          type: string
        quantity:
          type: integer
          format: int32
        price:
          type: number
          format: double
        specialprice:
          type: number
          format: double
        discount:
          type: number
          format: double
    CartDTO:
      type: object
      properties:
        cartId:
          type: integer
          format: int64
        totalPrice:
          type: number
          format: double
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductDTO'
    AddressDTO:
      type: object
      properties:
        addressId:
